name: Termine abholen

on:
  schedule:
    - cron: "0 4 1,15 * *"   # am 1. und 15. jedes Monats, 5 bzw. 6 Uhr Berliner Zeit
  workflow_dispatch:          # Knopf "Run workflow" zum Abholen von Hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_events.py
      - name: Änderungen speichern
        run: |
          git config user.name "Kiezkinder-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/venues.json
          git diff --cached --quiet || git commit -m "Termine aktualisiert"
          git pull --rebase
          git push
